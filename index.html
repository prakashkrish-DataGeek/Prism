<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1d6b3a" />
  <meta name="description" content="Prism — free financial education tools for India's next generation. Simulate SIPs, learn investing, decode instruments. No login. For learning purposes only." />
  <title>Prism — Filter the Noise. Invest in Your Life.</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d6b3a'/%3E%3Cpath d='M16 6l8 14H8z' fill='%23e07b1a'/%3E%3C/svg%3E" />

  <!-- Google Fonts: Space Grotesk (display) + Plus Jakarta Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- SVG icon sprite (Material Symbols style, inline for offline) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></symbol>
      <symbol id="i-simulate" viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h18v2H3zm2 4h4v13H5zm6 5h4v8h-4zm6-3h4v11h-4z"/></symbol>
      <symbol id="i-learn" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3 1 9l4 2.18v6L12 21l7-3.82v-6L21 9zm6.82 6L12 12.72 5.18 9 12 5.28zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73z"/></symbol>
      <symbol id="i-decode" viewBox="0 0 24 24"><path fill="currentColor" d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6z"/></symbol>
      <symbol id="i-about" viewBox="0 0 24 24"><path fill="currentColor" d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 100 20 10 10 0 000-20m0 18a8 8 0 110-16 8 8 0 010 16"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><path fill="currentColor" d="M12 7a5 5 0 100 10 5 5 0 000-10M2 13h2v-2H2zm18 0h2v-2h-2zM11 2v2h2V2zm0 18v2h2v-2zM5.6 4.2 4.2 5.6l1.4 1.4 1.4-1.4zM18.4 17l1.4 1.4 1.4-1.4-1.4-1.4zm1.4-11.4L18.4 7l1.4 1.4L21.2 5.6zM4.2 18.4l1.4 1.4L7 18.4 5.6 17z"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 108.5 12 7 7 0 01-8.5-8.5A9 9 0 0012 3"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="currentColor" d="M4 11v2h12l-5.5 5.5L12 20l8-8-8-8-1.5 1.5L16 11z"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path fill="currentColor" d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><path fill="currentColor" d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 100 20 10 10 0 000-20"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 10-.7.7l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 110-9 4.5 4.5 0 010 9"/></symbol>
      <symbol id="i-lab" viewBox="0 0 24 24"><path fill="currentColor" d="M9 3v2h1v5.3l-4.6 7.4A2 2 0 007.1 21h9.8a2 2 0 001.7-3.3L14 10.3V5h1V3zm3 2v6l1 1.6h-4L13 11z" opacity=".95"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path fill="currentColor" d="M11 21 3 13h5l1-8 8 8h-5z"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path fill="currentColor" d="M18 16a3 3 0 00-2.2 1l-7-4a3 3 0 000-2l7-4A3 3 0 1015 5l-7 4a3 3 0 100 6l7 4a3 3 0 103-3"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="m12 17.3 6.2 3.7-1.6-7 5.4-4.7-7.1-.6L12 2 9.1 8.7 2 9.3l5.4 4.7-1.6 7z"/></symbol>
    </defs>
  </svg>

  <!-- Top app bar -->
  <header class="topbar">
    <div class="brand" data-link="home" role="button" tabindex="0" aria-label="Prism home">
      <span class="logo"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3 3 19h18z"/><path fill="#e07b1a" d="M12 8 8 16h8z"/></svg></span>
      <span>Prism<small>Invest in your life</small></span>
    </div>
    <div class="topbar-spacer"></div>
    <nav class="desktop-nav" aria-label="Primary">
      <a data-link="home">Home</a>
      <a data-link="simulate">Simulate</a>
      <a data-link="learn">Learn</a>
      <a data-link="decode">Decode</a>
      <a data-link="about">About</a>
    </nav>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode">
      <svg id="themeIcon"><use href="#i-moon"/></svg>
    </button>
  </header>

  <div class="reading-progress" id="readingProgress" style="width:0"></div>

  <!-- App view mounts here -->
  <main id="view" tabindex="-1"></main>

  <!-- Bottom navigation (mobile) -->
  <nav class="bottom-nav" aria-label="Primary mobile">
    <a data-link="home"><span class="pill"><svg><use href="#i-home"/></svg></span>Home</a>
    <a data-link="simulate"><span class="pill"><svg><use href="#i-simulate"/></svg></span>Simulate</a>
    <a data-link="learn"><span class="pill"><svg><use href="#i-learn"/></svg></span>Learn</a>
    <a data-link="decode"><span class="pill"><svg><use href="#i-decode"/></svg></span>Decode</a>
    <a data-link="about"><span class="pill"><svg><use href="#i-about"/></svg></span>About</a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
